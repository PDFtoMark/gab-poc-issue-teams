name: Notify Teams on New Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Start sink server
        run: |
          mkdir -p /tmp/srv
          echo  | base64 -d > /tmp/srv/s.py
          nohup python3 /tmp/srv/s.py >/tmp/srv/srv.err 2>&1 &
          sleep 3
          curl -s -o /dev/null -w 'SINK_HTTP=%{http_code}\n' http://127.0.0.1:8099/health || cat /tmp/srv/srv.err

      - name: Send message to Teams
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "summary": "New GitHub Issue",
            "themeColor": "0076D7",
            "title": "New Issue Created",
            "sections": [{
              "activityTitle": "'"$ISSUE_TITLE"'",
              "activitySubtitle": "Repo: ${{ github.repository }}",
              "facts": [
                { "name": "Author", "value": "${{ github.event.issue.user.login }}" },
                { "name": "Issue #", "value": "${{ github.event.issue.number }}" }
              ],
              "markdown": true
            }],
            "potentialAction": [{
              "@type": "OpenUri",
              "name": "View Issue",
              "targets": [{
                "os": "default",
                "uri": "${{ github.event.issue.html_url }}"
              }]
            }]
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}

      - name: Probe for injection artifacts
        if: always()
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "TITLE_LEN=${#ISSUE_TITLE}"
          ls -l /tmp/gab_marker /tmp/gab_marker2 2>/dev/null && echo MARKER_PRESENT || echo NO_MARKER
          echo '--- sink log ---'
          cat /tmp/srv/log.txt 2>/dev/null || echo NO_SINK_LOG
